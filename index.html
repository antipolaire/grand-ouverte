<html lang="de">
<head>
  <meta charset="UTF-8" />

  <!-- Open Graph / Facebook -->

  <!-- Manifest for PWA support -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Prevent FOUT (Flash of Unstyled Text) -->
  <style>
    /* Critical CSS - inline for instant render */
    body {
      margin: 0;
      background: #0a0a0a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Loading spinner for better UX */
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0a0a0a;
      z-index: 9999;
    }

    #loading::after {
      content: '';
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ca0f5c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Hide loading when React mounts */
    #root:not(:empty) ~ #loading {
      display: none;
    }
  </style>
</head>
<body>
<!-- App root -->
<div id="root"></div>

<div id="loading" aria-label="Loading"></div>
